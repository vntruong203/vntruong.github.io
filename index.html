<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <meta http-equiv="Permissions-Policy" content="interest-cohort=()">
    <title>Trương Nhật Vũ - Cardname</title>

	<!-- jQuery -->
	<script src="https://cdn.jsdelivr.net/npm/jquery@3.6.4/dist/jquery.min.js"></script>
	
	<!-- Foundation framework -->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/foundation-sites@6.7.5/dist/css/foundation.min.css" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/foundation-sites@6.7.5/dist/js/foundation.min.js" crossorigin="anonymous"></script>
    
    <!-- Font Awesome -->
    <script src="https://kit.fontawesome.com/656c940340.js" crossorigin="anonymous"></script>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body id="body" data-toggler=".dark" class="dark background condensed">
	<div>
		<div class="main">
			<div class="vcard">
				<div class="grid-x grid-padding-x align-center">
					<div class="cell shrink align-self-middle">					
						<div class="head">
							<!-- Nút danh thiếp - soạn email -->
							<a href="mailto:vntruong@dlmeco.vn" id="vcard-link" class="vcard-link">
								<i class="fa-solid fa-address-card fa-lg" title="Gửi email cho tôi"></i>
							</a>

							<!-- QR Code toggle -->
							<span id="qrcode-link" data-toggle="avatar qrcode note-link body" data-toggler=".is-hidden" class="qrcode-link is-hidden">
								<i class="fa-solid fa-qrcode fa-lg"></i>
							</span>

							<!-- Avatar và QR -->
							<div id="round" data-toggler=".text" class="round">
								<img src="avatar.jpg" id="avatar" data-toggler=".is-hidden" class="avatar">
								<img src="qrcode.png" id="qrcode" data-toggle="avatar body qrcode note-link" data-toggler=".is-hidden" class="qrcode is-hidden">
								<span id="note" data-toggler=".is-hidden" class="note is-hidden"></span>
							</div>

							<span id="note-link" data-toggle="avatar note round qrcode-link" data-toggler=".is-hidden" class="note-link is-hidden">
								<i class="fa-solid fa-circle-info fa-lg"></i>
							</span>
							
							<a href="/" target="_blank" id="url" class="url is-hidden">
								<i class="fa-solid fa-link fa-lg"></i>
							</a>
						</div>
					</div>

					<div class="cell medium-auto align-self-middle">
						<h1 id="name" class="name">
							<span id="fn">Trương Nhật Vũ</span>
							<small id="org">CT CP Cơ Khí Xây Lắp Và Thương Mại DL</small>
						</h1>
						<div id="email" class="email">
							<a href="mailto:vntruong@dlmeco.vn">vntruong@dlmeco.vn</a>
						</div>
						<div id="social" class="social">
							<!-- Facebook -->
							<a href="https://www.facebook.com/profile.php?id=61554140925039" target="_blank" title="Facebook" id="facebook">
								<i class="fa-brands fa-facebook fa-lg"></i>
							</a>

							<!-- Zalo -->
							<a href="https://zalo.me/0981566630" target="_blank" title="Zalo" id="zalo">
								<img src="zalo-icon.png" alt="Zalo" style="width:24px; vertical-align:middle; border-radius:50%;">
							</a>
						</div>
					</div>
				</div>
			</div>	
		</div>
	</div>		

	<!-- Init Foundation -->
	<script>
		$(document).foundation();
	</script>
	
	<!-- Custom Script -->
	<script src="script.js"></script>
</body>
</html>
